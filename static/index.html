<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIGC Workflow MVP</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #2563eb;
      --start: #16a34a;
      --llm: #7c3aed;
      --template: #0891b2;
      --end: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; gap: 12px; padding: 12px 18px;
      background: var(--panel); border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 16px; font-weight: 600; }
    header .sub { color: var(--muted); font-size: 12px; }
    .toolbar { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
      padding: 7px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { opacity: .9; }
    main { flex: 1; display: flex; min-height: 0; }
    #canvas-wrap { flex: 1; position: relative; overflow: hidden; }
    #canvas {
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
    }
    aside {
      width: 320px; border-left: 1px solid var(--border); background: var(--panel);
      display: flex; flex-direction: column; min-height: 0;
    }
    aside section { padding: 14px; border-bottom: 1px solid var(--border); }
    aside h3 { font-size: 13px; margin-bottom: 10px; color: var(--muted); }
    .node-type-list { display: flex; flex-direction: column; gap: 6px; }
    .node-type-list button { text-align: left; }
    label { font-size: 12px; color: var(--muted); display: block; margin: 8px 0 4px; }
    textarea, input[type=text], select {
      width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px;
      font-size: 13px; font-family: inherit; resize: vertical;
    }
    #log {
      flex: 1; overflow-y: auto; padding: 14px; font-size: 12px; font-family: ui-monospace, monospace;
    }
    .log-item { padding: 8px; border-radius: 8px; margin-bottom: 8px; background: #f8fafc; border: 1px solid var(--border); }
    .log-item.success { border-left: 3px solid var(--start); }
    .log-item.error { border-left: 3px solid var(--end); }
    .log-item .meta { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    .node {
      position: absolute; width: 180px; border-radius: 12px; background: var(--panel);
      border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(15,23,42,.08);
      padding: 10px 12px; cursor: grab; user-select: none;
    }
    .node.selected { border-color: var(--accent); }
    .node .title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .node .desc { font-size: 11px; color: var(--muted); min-height: 14px; word-break: break-all; }
    .node .port {
      position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #fff;
      border: 2px solid var(--accent); top: 50%; transform: translateY(-50%);
    }
    .port.in { left: -7px; }
    .port.out { right: -7px; cursor: crosshair; }
    .node[data-type=start] { border-top: 3px solid var(--start); }
    .node[data-type=llm] { border-top: 3px solid var(--llm); }
    .node[data-type=template] { border-top: 3px solid var(--template); }
    .node[data-type=end] { border-top: 3px solid var(--end); }
    svg#edges { position: absolute; inset: 0; pointer-events: none; }
    .edge-path { stroke: var(--accent); stroke-width: 2; fill: none; }
    .edge-hit { stroke: transparent; stroke-width: 12; fill: none; pointer-events: stroke; cursor: pointer; }
    .hint { font-size: 11px; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <h1>AIGC Workflow MVP</h1>
    <span class="sub">节点编排 · DAG 执行 · 对标 Dify 简化版</span>
    <div class="toolbar">
      <button id="btn-example">载入示例</button>
      <button id="btn-export">导出 JSON</button>
      <button id="btn-import">导入 JSON</button>
      <button id="btn-clear">清空</button>
      <button id="btn-run" class="primary">运行工作流</button>
    </div>
  </header>
  <main>
    <div id="canvas-wrap">
      <svg id="edges"></svg>
      <div id="canvas"></div>
      <input type="file" id="import-file" accept=".json" hidden />
    </div>
    <aside>
      <section>
        <h3>添加节点</h3>
        <div class="node-type-list">
          <button data-add="start">● 开始（Start）</button>
          <button data-add="llm">◆ 大模型（LLM）</button>
          <button data-add="template">▤ 模板（Template）</button>
          <button data-add="end">■ 结束（End）</button>
        </div>
        <p class="hint" style="margin-top:8px">从节点右侧圆点拖出连线到下一节点左侧圆点；点击连线可删除。</p>
      </section>
      <section>
        <h3>节点配置</h3>
        <div id="config-panel"><p class="hint">选中画布中的节点后在此编辑。</p></div>
      </section>
      <section style="flex:1; display:flex; flex-direction:column; min-height:0;">
        <h3>运行日志</h3>
        <div id="log"></div>
      </section>
    </aside>
  </main>

  <script>
  // ---------------------------------------------------------------------------
  // 状态
  // ---------------------------------------------------------------------------
  const state = {
    nodes: [],   // {id, type, position:{x,y}, config:{}}
    edges: [],   // {source, target}
    selected: null,
    nextId: 1,
    connecting: null, // {source, fromX, fromY}
  };

  const canvas = document.getElementById('canvas');
  const svg = document.getElementById('edges');
  const logEl = document.getElementById('log');
  const TYPE_META = {
    start:    { label: '开始',   color: 'var(--start)' },
    llm:      { label: 'LLM',    color: 'var(--llm)' },
    template: { label: '模板',   color: 'var(--template)' },
    end:      { label: '结束',    color: 'var(--end)' },
  };

  function uid(prefix) { return `${prefix}_${state.nextId++}`; }

  // ---------------------------------------------------------------------------
  // 渲染
  // ---------------------------------------------------------------------------
  function render() {
    canvas.querySelectorAll('.node').forEach(n => n.remove());
    svg.innerHTML = '';
    state.nodes.forEach(node => {
      const el = document.createElement('div');
      el.className = 'node' + (state.selected === node.id ? ' selected' : '');
      el.dataset.type = node.type;
      el.style.left = node.position.x + 'px';
      el.style.top = node.position.y + 'px';
      const meta = TYPE_META[node.type];
      const desc = describeConfig(node);
      el.innerHTML = `
        <div class="title" style="color:${meta.color}">${meta.label}</div>
        <div class="desc">${escapeHtml(desc)}</div>
        <div class="port in"></div>
        <div class="port out"></div>`;
      el.addEventListener('mousedown', (e) => onNodeMouseDown(e, node.id));
      el.querySelector('.port.out').addEventListener('mousedown', (e) => startConnect(e, node.id));
      el.querySelector('.port.in').addEventListener('mouseup', (e) => finishConnect(e, node.id));
      canvas.appendChild(el);
    });
    renderEdges();
    renderConfig();
  }

  function describeConfig(node) {
    const c = node.config || {};
    if (node.type === 'start') return c.input || '输入内容';
    if (node.type === 'llm') return c.prompt || '提示词';
    if (node.type === 'template') return c.text || '模板文本';
    if (node.type === 'end') return c.output || '输出内容';
    return '';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function nodeCenter(id) {
    const node = state.nodes.find(n => n.id === id);
    return { x: node.position.x + 90, y: node.position.y + 30 };
  }

  function renderEdges() {
    state.edges.forEach((edge, idx) => {
      const a = nodeCenter(edge.source), b = nodeCenter(edge.target);
      const path = `M ${a.x + 90} ${a.y} C ${a.x + 140} ${a.y}, ${b.x - 140} ${b.y}, ${b.x - 90} ${b.y}`;
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', path); p.setAttribute('class', 'edge-path');
      const hit = p.cloneNode(); hit.setAttribute('class', 'edge-hit');
      hit.addEventListener('click', () => { state.edges.splice(idx, 1); render(); });
      svg.appendChild(p); svg.appendChild(hit);
    });
  }

  // ---------------------------------------------------------------------------
  // 拖拽与连线
  // ---------------------------------------------------------------------------
  function onNodeMouseDown(e, id) {
    if (e.target.classList.contains('port')) return;
    state.selected = id;
    const node = state.nodes.find(n => n.id === id);
    const offsetX = e.clientX - node.position.x;
    const offsetY = e.clientY - node.position.y;
    const move = (ev) => {
      node.position.x = Math.max(0, ev.clientX - offsetX);
      node.position.y = Math.max(0, ev.clientY - offsetY);
      render();
    };
    const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    render();
  }

  function startConnect(e, sourceId) {
    e.stopPropagation();
    state.connecting = { source: sourceId };
    const move = (ev) => {
      const wrap = document.getElementById('canvas-wrap').getBoundingClientRect();
      let svgPath = svg.querySelector('.temp');
      if (!svgPath) {
        svgPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        svgPath.setAttribute('class', 'edge-path temp');
        svg.appendChild(svgPath);
      }
      const a = nodeCenter(sourceId);
      svgPath.setAttribute('d', `M ${a.x + 90} ${a.y} L ${ev.clientX - wrap.left} ${ev.clientY - wrap.top}`);
    };
    const up = () => {
      document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
      state.connecting = null;
      const t = svg.querySelector('.temp'); if (t) t.remove();
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  }

  function finishConnect(e, targetId) {
    if (!state.connecting) return;
    const source = state.connecting.source;
    if (source !== targetId && !state.edges.some(x => x.source === source && x.target === targetId)) {
      state.edges.push({ source, target: targetId });
    }
    render();
  }

  // ---------------------------------------------------------------------------
  // 配置面板
  // ---------------------------------------------------------------------------
  function renderConfig() {
    const panel = document.getElementById('config-panel');
    const node = state.nodes.find(n => n.id === state.selected);
    if (!node) { panel.innerHTML = '<p class="hint">选中画布中的节点后在此编辑。</p>'; return; }
    const c = node.config;
    let field = '';
    if (node.type === 'start') {
      field = `<label>输入内容</label><textarea id="cfg-input" rows="3">${escapeHtml(c.input || '')}</textarea>`;
    } else if (node.type === 'llm') {
      field = `
        <label>提示词（可用 {{ 节点ID.output }} 引用上游输出）</label>
        <textarea id="cfg-prompt" rows="4">${escapeHtml(c.prompt || '')}</textarea>
        <label>Mock 离线模式（无 API Key 时勾选）</label>
        <select id="cfg-mock">
          <option value="true" ${c.mock !== false ? 'selected' : ''}>开启 Mock</option>
          <option value="false" ${c.mock === false ? 'selected' : ''}>调用真实 LLM（需后端接入）</option>
        </select>
        <label>Mock 风格</label>
        <select id="cfg-style">
          <option value="echo" ${c.mock_style !== 'poem' ? 'selected' : ''}>原样回显</option>
          <option value="poem" ${c.mock_style === 'poem' ? 'selected' : ''}>模拟成诗</option>
        </select>`;
    } else if (node.type === 'template') {
      field = `<label>模板文本</label><textarea id="cfg-text" rows="3">${escapeHtml(c.text || '')}</textarea>`;
    } else if (node.type === 'end') {
      field = `<label>输出表达式</label><textarea id="cfg-output" rows="3">${escapeHtml(c.output || '')}</textarea>`;
    }
    panel.innerHTML = field + `
      <button id="cfg-delete" style="margin-top:10px; color:var(--end); border-color:var(--end)">删除节点</button>`;

    const bind = (id, key) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', () => { c[key] = el.value; render(); });
    };
    bind('cfg-input', 'input'); bind('cfg-prompt', 'prompt');
    bind('cfg-text', 'text'); bind('cfg-output', 'output');
    const mockEl = document.getElementById('cfg-mock');
    if (mockEl) mockEl.addEventListener('change', () => { c.mock = mockEl.value === 'true'; render(); });
    const styleEl = document.getElementById('cfg-style');
    if (styleEl) styleEl.addEventListener('change', () => { c.mock_style = styleEl.value; render(); });
    document.getElementById('cfg-delete').addEventListener('click', () => {
      state.nodes = state.nodes.filter(n => n.id !== node.id);
      state.edges = state.edges.filter(x => x.source !== node.id && x.target !== node.id);
      state.selected = null; render();
    });
  }

  // ---------------------------------------------------------------------------
  // 节点增删 / 序列化
  // ---------------------------------------------------------------------------
  document.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.add;
      const id = uid(type);
      state.nodes.push({
        id, type,
        position: { x: 60 + state.nodes.length * 40, y: 60 + state.nodes.length * 30 },
        config: type === 'start' ? { input: '' }
              : type === 'llm' ? { prompt: '', mock: true, mock_style: 'echo' }
              : type === 'template' ? { text: '' }
              : { output: '' }
      });
      state.selected = id; render();
    });
  });

  function serialize() {
    return {
      nodes: state.nodes.map(n => ({ id: n.id, type: n.type, position: n.position, config: n.config })),
      edges: state.edges.map(e => ({ source: e.source, target: e.target })),
    };
  }

  function loadWorkflow(data) {
    state.nodes = data.nodes || [];
    state.edges = data.edges || [];
    state.selected = null;
    state.nextId = state.nodes.length + 1;
    render();
  }

  // ---------------------------------------------------------------------------
  // 工具栏动作
  // ---------------------------------------------------------------------------
  document.getElementById('btn-example').addEventListener('click', async () => {
    const res = await fetch('/api/workflow/example');
    const data = await res.json();
    loadWorkflow(data);
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    state.nodes = []; state.edges = []; state.selected = null; render();
  });

  document.getElementById('btn-export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(serialize(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'workflow.json'; a.click();
    URL.revokeObjectURL(a.href);
  });

  document.getElementById('btn-import').addEventListener('click', () => document.getElementById('import-file').click());
  document.getElementById('import-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => loadWorkflow(JSON.parse(reader.result));
    reader.readAsText(file);
  });

  function addLog(item) {
    const div = document.createElement('div');
    div.className = 'log-item ' + item.status;
    div.innerHTML = `<div class="meta">${escapeHtml(item.node_id || '')} · ${escapeHtml(item.node_type || '')} · ${item.elapsed_ms ?? ''}ms</div>
      <div>${escapeHtml(item.output ?? item.error ?? '')}</div>`;
    logEl.prepend(div);
  }

  document.getElementById('btn-run').addEventListener('click', async () => {
    logEl.innerHTML = '';
    const res = await fetch('/api/workflow/run', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ workflow: serialize() }),
    });
    const data = await res.json();
    if (data.detail) { addLog({ status: 'error', error: data.detail }); return; }
    (data.node_results || []).forEach(addLog);
    if (data.status === 'success') {
      addLog({ status: 'success', node_id: 'final', node_type: 'output', output: data.final_output });
    } else {
      addLog({ status: 'error', error: data.error });
    }
  });

  render();
  </script>
</body>
</html>
